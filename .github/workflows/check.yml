name: check

on:
  push:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the checker is dependency-free by design, so CI runs
      # exactly what a contributor runs locally. The karakuli-style skill lives
      # outside this repo, in the author's global Claude directory, so the two
      # checks that read it are skipped here — check-sync says so when it is.
      - name: Drift and invariants
        run: node tools/check-sync.mjs
