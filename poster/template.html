<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karakuli — Poster Templates</title>

<!--
  KARAKULI POSTER TEMPLATES — how to use this file
  ==================================================
  Three .poster blocks below (Stamp / Full-bleed shout / Notebook page) are
  each a real 1080x1080 canvas, previewed scaled-down via CSS transform so
  all three fit on screen at once. See POSTER.md for the rules behind them.

  TO DUPLICATE A BLOCK
    Copy one <div class="poster-frame"> ... </div> block wholesale, including
    its wrapping <figure>. Give the inner .poster a distinct id if you plan to
    reference it from a screenshot script. Nothing else needs renumbering —
    each block is self-contained (its own inline doodle SVGs, its own text).

  TO SWAP TEXT
    Edit the .headline / .accent-line / .annotation text nodes directly.
    Keep the type rules from POSTER.md: M PLUS Rounded 1c 700 (step up to 800
    only where 700 reads too light at poster scale) for headlines, sentence
    case by default (ALL CAPS sparingly, Full-bleed shout only), and at most
    one Shantell Sans accent/annotation line per poster.

  TO SWAP THE DOODLE
    Each poster's doodle is an inline <svg> with fill="none",
    stroke-linecap/linejoin="round", and wobble baked into the path data
    (cubic beziers nudged off perfect geometry, not a filter). Replace the
    <path> d= data with a new hand-drawn shape built the same way. Keep
    physical stroke width at roughly 1.5-2% of the poster's shorter side
    (~16-22px on a 1080 canvas) — thin lines disappear at poster scale.

  TO SCREENSHOT A BLOCK AT EXACT SIZE
    The on-page preview is scaled down (see --scale below) so it never
    represents true pixel size. To capture a poster at its real 1080x1080:
      1. Open this file directly in a browser tab (not inside another frame).
      2. Open DevTools > Responsive/Device Toolbar, set the viewport to
         exactly 1080x1080+ and the zoom/DPR to 100%.
      3. Add ?full to the URL (or just temporarily set --scale: 1 below) —
         this removes the preview scale-down so the poster renders 1:1.
      4. Screenshot just the .poster element's bounding box (most browser
         devtools let you screenshot a single selected node at native size).
    A 1080px-wide window plus --scale: 1 is the fastest path if you don't
    want to touch DevTools at all.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Shantell+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Karakuli tokens — see STYLE.md */
    --krk-paper: #F7F3E9;
    --krk-paper-2: #EFE9DA;
    --krk-ink: #26241F;
    --krk-ink-soft: #6B665C;
    --krk-ink-faint: #A9A294;
    --krk-pen-blue: #2F3AC7;
    --krk-pen-green: #2E7D46;
    --krk-pen-orange: #E07A1F;
    --krk-pen-pink: #D9569B;
    --krk-wash-lavender: #E6E3F4;
    --krk-wash-sage: #E2EAD9;
    --krk-wash-blush: #F6E0E2;
    --krk-wash-butter: #F6ECC9;
    --krk-danger: #B3402F;

    /* Preview scale: 1080px canvas shown at 480px. Set to 1 for a native
       1:1 screenshot (see instructions above). */
    --scale: 0.4444;
  }

  @media (max-width: 560px) {
    :root { --scale: 0.2963; } /* 1080px shown at 320px on narrow viewports */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 24px 120px;
    background: var(--krk-paper-2);
    color: var(--krk-ink);
    font-family: 'M PLUS Rounded 1c', 'Onest', 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 56px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  p.lede {
    max-width: 480px;
    text-align: center;
    color: var(--krk-ink-soft);
    font-size: 14px;
    line-height: 1.55;
    margin: -32px 0 0;
  }

  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  figcaption {
    font-size: 13px;
    color: var(--krk-ink-soft);
    letter-spacing: 0.02em;
  }

  figcaption b {
    color: var(--krk-ink);
    font-weight: 500;
  }

  .poster-frame {
    width: calc(1080px * var(--scale));
    height: calc(1080px * var(--scale));
    overflow: hidden;
    border: 1.5px solid var(--krk-ink-faint);
    border-radius: 10px 12px 9px 11px / 11px 9px 12px 10px;
  }

  .poster {
    width: 1080px;
    height: 1080px;
    transform: scale(var(--scale));
    transform-origin: top left;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .headline {
    font-family: 'M PLUS Rounded 1c', 'Onest', 'Inter', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-align: center;
    margin: 0;
  }

  .accent-line {
    font-family: 'Shantell Sans', 'Neucha', cursive;
    font-weight: 400;
    text-align: center;
    margin: 0;
  }

  /* ---------- 1. STAMP ---------- */

  .poster.stamp {
    background: var(--krk-paper);
    padding: 130px 110px;
    gap: 40px;
  }

  .poster.stamp .doodle { width: 600px; height: 600px; color: var(--krk-ink); }
  .poster.stamp .headline { font-size: 72px; color: var(--krk-ink); max-width: 820px; }
  .poster.stamp .accent-line { font-size: 30px; color: var(--krk-pen-blue); }

  /* ---------- 2. FULL-BLEED SHOUT ---------- */

  .poster.shout {
    background: var(--krk-danger);
    padding: 100px;
    gap: 36px;
  }

  .poster.shout .doodle { width: 380px; height: 380px; color: var(--krk-paper); }
  .poster.shout .headline {
    font-size: 128px;
    font-weight: 800; /* 700 read too light at this scale — see POSTER.md type rules */
    color: var(--krk-paper);
    text-transform: uppercase;
  }

  /* ---------- 3. NOTEBOOK PAGE ---------- */

  .poster.notebook {
    background-color: var(--krk-paper);
    background-image: radial-gradient(circle, var(--krk-ink-faint) 2.4px, transparent 2.6px);
    background-size: 44px 44px;
    background-position: 22px 22px;
    justify-content: flex-start;
    align-items: stretch;
    padding: 90px;
  }

  .notebook .card {
    margin: auto;
    width: 560px;
    padding: 64px 56px;
    background: var(--krk-paper-2);
    border: 1.5px solid var(--krk-ink);
    border-radius: 26px 32px 22px 30px / 30px 20px 34px 24px;
    text-align: center;
  }

  .notebook .card .headline { font-size: 44px; color: var(--krk-ink); }

  .notebook .annotation-wrap {
    position: absolute;
    top: 150px;
    right: 130px;
    width: 300px;
    text-align: right;
  }

  .notebook .annotation-wrap .accent-line {
    font-size: 36px;
    color: var(--krk-pen-pink);
    text-align: right;
  }

  .notebook .arrow-doodle {
    width: 170px;
    height: 90px;
    color: var(--krk-pen-pink);
    margin-top: 6px;
    transform: rotate(6deg);
  }

  .notebook .motif {
    position: absolute;
    color: var(--krk-ink-faint);
  }

  .notebook .motif.leaf { width: 90px; height: 90px; top: 70px; left: 90px; color: var(--krk-pen-green); }
  .notebook .motif.star { width: 70px; height: 70px; bottom: 90px; right: 100px; color: var(--krk-pen-orange); }

  svg.pen { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<h1>Karakuli — Poster Templates</h1>
<p class="lede">Three sanctioned layouts, live at true 1080&times;1080 proportions (scaled down for preview — see the comment at the top of this file's source for exact-size screenshotting).</p>

<!-- ============ 1. STAMP ============ -->
<figure>
  <figcaption><b>1 — Stamp.</b> Centred doodle, headline below, generous margins.</figcaption>
  <div class="poster-frame">
    <div class="poster stamp">
      <!-- library motif: doodles/flower-daisy.svg, viewBox and paths untouched, root
           stroke-width overridden 2.8 -> 1.5 so petals stay open loops at poster scale
           (600px render / 48 viewBox = 12.5x; 1.5 * 12.5 ~= 19px, ~1.7% of the 1080
           poster side, inside POSTER.md's 1.5-2% rule) -->
      <svg class="doodle pen" viewBox="0 0 48 48" stroke-width="1.5">
        <path d="M24,13 C25.3,10.7 24.9,8.5 23,6.5 C21.7,8.8 22.1,11 24,13 M26,14 C29,13.6 31,11.9 32,9 C29,9.4 27,11.1 26,14 M26.5,17 C28.2,19.2 30.4,19.9 33,19 C31.3,16.8 29.1,16.1 26.5,17 M25,18.5 C24.5,21.3 25.6,23.5 28,25 C28.5,22.2 27.4,20 25,18.5 M22,18 C19.1,19 17.4,21 17,24 C19.9,23 21.6,21 22,18 M21,16 C18.9,14.1 16.5,13.8 14,15 C16.1,16.9 18.5,17.3 21,16"/>
        <path d="M22,15 C22,13 26,13 26,15 C26,17.5 22,17.5 22,15"/>
        <path d="M24,18.5 C23,26 25,34 23,42 M23,31 C18,29 16,32 19,35 C21,34 23,33 23,31"/>
      </svg>
      <p class="headline">Скоро что-то хорошее</p>
      <p class="accent-line">готовим что-то тёплое</p>
    </div>
  </div>
</figure>

<!-- ============ 2. FULL-BLEED SHOUT ============ -->
<figure>
  <figcaption><b>2 — Full-bleed shout.</b> One loud colour, doodle and type reversed in paper.</figcaption>
  <div class="poster-frame">
    <div class="poster shout">
      <!-- wobbly checkmark, stroke-only, cubic beziers, viewBox 200x200 -->
      <svg class="doodle pen" viewBox="0 0 200 200" stroke-width="20">
        <path d="M 40 106 C 54 118 68 132 83 149 C 79 149 79 149 79 149 C 108 112 139 69 167 39"/>
      </svg>
      <p class="headline">Готово!</p>
    </div>
  </div>
</figure>

<!-- ============ 3. NOTEBOOK PAGE ============ -->
<figure>
  <figcaption><b>3 — Notebook page.</b> Dotted grid, scattered small doodles, hand-font annotation with an arrow.</figcaption>
  <div class="poster-frame">
    <div class="poster notebook">
      <!-- small leaf motif, doodle-icon scale -->
      <svg class="motif leaf pen" viewBox="0 0 48 48" stroke-width="2.8">
        <path d="M 8 40 C 10 24 20 12 40 8 C 38 26 30 38 8 40 Z"/>
        <path d="M 10 38 C 18 30 26 22 38 10"/>
      </svg>

      <!-- small star motif, doodle-icon scale -->
      <svg class="motif star pen" viewBox="0 0 48 48" stroke-width="2.8">
        <path d="M 24 6 C 26 16 24 20 34 24 C 24 27 26 32 24 42 C 22 32 24 27 14 24 C 24 20 22 16 24 6 Z"/>
      </svg>

      <div class="card">
        <p class="headline">Новая фича</p>
      </div>

      <div class="annotation-wrap">
        <p class="accent-line">это новая фича &rarr;</p>
        <!-- hand-drawn arrow, curved shaft + wobbly barbs -->
        <svg class="arrow-doodle pen" viewBox="0 0 170 90" stroke-width="6">
          <path d="M 160 14 C 118 16 60 34 16 66"/>
          <path d="M 16 66 C 24 54 28 48 30 40"/>
          <path d="M 16 66 C 26 68 33 68 42 70"/>
        </svg>
      </div>
    </div>
  </div>
</figure>

</body>
</html>
